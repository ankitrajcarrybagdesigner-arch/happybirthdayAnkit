<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Ankit Raj</title>
<style>
  :root { --gold:#ffd778; --pink:#ff7bd5; --blue:#78e7ff; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; overflow:hidden; display:grid; place-items:center;
    font-family: "Trebuchet MS", Arial, sans-serif; color:#fff;
    background: radial-gradient(ellipse at 50% 15%, #40206f 0%, #170d38 42%, #070817 100%);
  }
  .stars, .stars:before, .stars:after {
    position:absolute; inset:0; content:""; pointer-events:none;
    background-image: radial-gradient(2px 2px at 20% 30%, #fff 99%, transparent),
      radial-gradient(1px 1px at 70% 20%, #ffd778 99%, transparent),
      radial-gradient(2px 2px at 80% 70%, #78e7ff 99%, transparent),
      radial-gradient(1px 1px at 35% 80%, #fff 99%, transparent),
      radial-gradient(1px 1px at 60% 55%, #ff7bd5 99%, transparent);
    background-size: 230px 190px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars:before { transform:translate(65px,35px); opacity:.55; }
  .stars:after { transform:translate(-40px,70px); opacity:.35; }
  @keyframes twinkle { to { opacity:.45; } }
  .card {
    position:relative; z-index:1; width:min(92vw, 760px); padding:clamp(28px,6vw,62px) 22px;
    text-align:center; border:1px solid rgba(255,255,255,.25); border-radius:30px;
    background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045));
    box-shadow:0 0 70px rgba(180,80,255,.2), inset 0 0 35px rgba(255,255,255,.035);
    backdrop-filter:blur(8px);
  }
  .eyebrow { letter-spacing:.38em; text-transform:uppercase; color:var(--blue); font-size:.75rem; }
  .cake { font-size:clamp(42px,8vw,70px); margin:14px 0 4px; filter:drop-shadow(0 0 18px #ff7bd588); }
  h1 {
    margin:0; font-size:clamp(2.5rem,8vw,5.6rem); line-height:1.02; font-weight:900;
    letter-spacing:-.045em; color:var(--gold);
    text-shadow:0 0 14px #ffbf4c77, 0 0 42px #ff7bd566;
  }
  .name {
    margin:18px 0 12px; font-size:clamp(1.6rem,5vw,3.1rem); font-weight:800;
    background:linear-gradient(90deg,#fff,var(--pink),var(--blue),#fff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .message { max-width:560px; margin:0 auto; color:#eee8ff; line-height:1.8; font-size:clamp(.95rem,2.5vw,1.15rem); }
  .date {
    display:inline-block; margin-top:25px; padding:12px 22px; border-radius:999px;
    border:1px solid #ffd77888; color:var(--gold); background:#ffd77812;
    font-weight:700; letter-spacing:.04em;
  }
  .footer { margin-top:25px; color:#bcb3df; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; }
  .spark { position:absolute; font-size:20px; animation:float 5s ease-in-out infinite; }
  .s1 { top:12%; left:9%; } .s2 { top:18%; right:10%; animation-delay:1s; }
  .s3 { bottom:14%; left:12%; animation-delay:2s; } .s4 { bottom:12%; right:12%; animation-delay:1.5s; }
  @keyframes float { 50% { transform:translateY(-16px) rotate(12deg); } }
  .confetti { position:fixed; top:-20px; width:8px; height:14px; opacity:.8; animation:fall linear infinite; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { *,*:before,*:after { animation:none !important; } }
</style>
</head>
<body>
<div class="stars"></div>
<div class="spark s1">✦</div><div class="spark s2">✧</div>
<div class="spark s3">✦</div><div class="spark s4">✧</div>
<main class="card">
  <div class="eyebrow">A special day • A special person</div>
  <div class="cake">🎂</div>
  <h1>Happy<br>Birthday!</h1>
  <div class="name">Ankit Raj</div>
  <p class="message">May your new year of life shine with happiness, success, good health, and beautiful surprises. Keep smiling, keep dreaming, and make every moment count! ✨</p>
  <div class="date">📅 Sunday, 29 November 2026</div>
  <div class="footer">Make a wish • Celebrate your magic</div>
</main>
<script>
  const colors = ['#ffd778','#ff7bd5','#78e7ff','#ffffff','#b99aff'];
  for (let i = 0; i < 36; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (5 + Math.random() * 8) + 's';
    piece.style.animationDelay = (-Math.random() * 12) + 's';
    piece.style.transform = `rotate(${Math.random()*180}deg)`;
    document.body.appendChild(piece);
  }
</script>
</body>
</html>
